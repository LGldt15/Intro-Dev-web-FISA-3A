<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="liststyle.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <title></title>
</head>
<body x-data="{ darkMode: false, dyslexie: false }" :class="{ 'dark': darkMode , 'dyslex': dyslexie}" >   
    <h1>Ma liste de taches</h1>
    <h2>préferences</h2>



<div  :class="{ dark: darkMode }" >  
     <button @click="darkMode= !darkMode">Mode Sombre</button>
<div x-show="darkMode">
    <p>Theme sombre activé</p>
</div>
    </div>
<style>
    body.dark {
        background: #1e1e1e;
        color: #f5f5f5;
    }
</style>
    



    <button @click="dyslexie = !dyslexie">Lecture Facilitée</button>
<style>
    body.dyslex{
        line-height: 1.8;
        letter-spacing: 0.05em;
        word-spacing: 0.12em;
    }
    .dyslexie p, .dyslexie li {
        max-width: 70ch;
        font-size: 1.08rem;
}
</style>

    <br><br>


    <form action="">
        <textarea name="" id="" placeholder="Nouvelle tache..."></textarea> <button>Envoyer</button>
    </form>

    <div class="data" id="Stats">
        <h2>Statistiques</h2>
        <p>Totales</p>
        <p>Terminées</p>
        <p>Restantes</p>
    </div>

    <div class="data" id="Mes_taches">
        <h2>Mes taches</h2>
        <p>Aucune tache pour le moment.</p>
    </div>


</body>
</html>
